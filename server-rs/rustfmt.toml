# Team rustfmt config — stable options only, so the system (non-nightly) toolchain can check it.
# Import grouping/merging and similar options are unstable (nightly-only); they're left out so
# local `cargo fmt` and CI's `cargo fmt --check` agree on stable.
edition = "2021"
max_width = 100
newline_style = "Unix"
use_small_heuristics = "Default"
