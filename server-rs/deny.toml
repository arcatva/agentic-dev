# cargo-deny supply-chain policy.
# The merge gate runs licenses + bans + sources only (see the lint job in .github/workflows/ci.yml).
# advisories run in a separate non-blocking job — a new RustSec advisory must not redden unrelated
# PRs (see docs/superpowers/specs/2026-07-11-enterprise-refactor-design.md §4.1).

[graph]
all-features = true

[licenses]
# Covers every license present in the dependency tree (enumerated with `cargo metadata`). For an
# OR expression any one allowed license suffices; for AND, every part must be listed here. The
# workspace crate's own license is declared as MIT in Cargo.toml.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[advisories]
# Checked only in the separate non-blocking job; kept here as valid config.
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
