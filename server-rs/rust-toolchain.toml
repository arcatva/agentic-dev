# Pin the toolchain so every developer, CI runner, and worktree uses the same compiler, and to
# set an MSRV baseline. Bump `channel` deliberately (and update the `toolchain` input in CI's
# dtolnay/rust-toolchain step to match). Note: on a system Rust install without rustup this file is
# ignored and the system toolchain is used — the versions just need to match.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
