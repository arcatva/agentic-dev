# CI: run the Rust test suite (never hits real claude — tests use the fake bridge fixtures),
# plus format / lint / supply-chain gates.
name: ci

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: CI only reads the repo. (release.yml keeps its own contents: write.)
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned to an immutable commit SHA (dtolnay/rust-toolchain master @ 2026-07) for supply-chain
      # safety; toolchain matches server-rs/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
      - name: cargo test
        run: cargo test
        working-directory: server-rs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
      - name: rustfmt --check
        run: cargo fmt --check
        working-directory: server-rs
      # clippy is warn-only for now (no -D): the tree has an existing backlog and clippy has no
      # baseline mechanism. Flip to `-D warnings` once the backlog is cleared (B1b).
      - name: clippy (warn-only)
        run: cargo clippy --all-targets
        working-directory: server-rs
      - name: cargo-deny (licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: server-rs/Cargo.toml
          command: check licenses bans sources

  # Advisories run separately and never block a PR merge (continue-on-error): a new RustSec
  # advisory must not redden unrelated PRs — it is an early-warning signal only.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: cargo-deny (advisories, non-blocking)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: server-rs/Cargo.toml
          command: check advisories

  # Node SDK bridge: syntax + lint (the bridge is the sole production claude transport but has no
  # Rust test coverage of its own — this at least gates parse errors and obvious JS mistakes).
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: npm ci (bridge, with dev deps)
        run: npm ci --no-fund --no-audit
        working-directory: server-rs/sdk-bridge
      - name: node --check
        run: npm run check
        working-directory: server-rs/sdk-bridge
      - name: eslint
        run: npm run lint
        working-directory: server-rs/sdk-bridge

